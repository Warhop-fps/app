# Date: 06NOV2026
# Author: Minkyu Jung
# Purpose: main으로 들어오는 PR마다 npm run check(머리말·금지 단어·import·맵·마이그레이션·시험)를 돌린다.
#          server/api/package.json에 test 스크립트가 있으면 API Worker 시험도 돌린다. 지금은 없어서 건너뛴다(시험은 tests/api-*.test.mjs).
#          main 보호 규칙의 필수 검사 이름은 "pr-check / check"다(docs/GITHUB_PROTECT_SOP.md).
name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:headers가 origin/main..HEAD 커밋 메시지를 보므로 기록 전체가 필요하다
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 저장소 검사(npm run check)
        run: npm run check
      - name: API Worker 시험 스크립트가 있는지 확인
        id: api
        run: |
          if node -e "const p=require('./server/api/package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            echo "has_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test=false" >> "$GITHUB_OUTPUT"
            echo "::notice::server/api에 test 스크립트가 없어 건너뜁니다(API 시험은 npm test 안에 있습니다)."
          fi
      - name: API Worker 시험
        if: steps.api.outputs.has_test == 'true'
        working-directory: server/api
        run: |
          npm ci
          npm test
